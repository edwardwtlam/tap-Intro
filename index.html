<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tapdex-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Primary SEO -->
    <title>Tapdex — NFC Digital Business Card | Lifetime Free Data Management</title>
    <meta name="description" content="Tapdex NFC digital business cards with lifetime free data management. Update your contact info anytime — no reprints, no fees. Tap to share instantly with any phone. Based in Hong Kong, shipping worldwide." />
    <meta name="keywords" content="NFC digital business card, NFC business card, digital name card, tap to share, contactless business card, smart business card, NFC卡片, 數碼名片, 智能名片, 電子名片, NFC名片, Hong Kong, 香港" />
    <meta name="author" content="Tapdex" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#06b6d4" />
    <link rel="canonical" href="https://tapdex.com" />

    <!-- GEO Tags — Hong Kong -->
    <meta name="geo.region" content="HK" />
    <meta name="geo.placename" content="Hong Kong" />
    <meta name="geo.position" content="22.3193;114.1694" />
    <meta name="ICBM" content="22.3193, 114.1694" />

    <!-- Language / Hreflang -->
    <link rel="alternate" hreflang="en" href="https://tapdex.com" />
    <link rel="alternate" hreflang="zh-HK" href="https://tapdex.com/zh" />
    <link rel="alternate" hreflang="x-default" href="https://tapdex.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tapdex" />
    <meta property="og:title" content="Tapdex — NFC Digital Business Card | Lifetime Free Updates" />
    <meta property="og:description" content="NFC digital business cards with lifetime free data management. Update your info anytime — no reprints, no fees. Tap to share instantly. Based in Hong Kong, shipping worldwide." />
    <meta property="og:image" content="https://tapdex.com/tapdex-logo.svg" />
    <meta property="og:image:width" content="200" />
    <meta property="og:image:height" content="100" />
    <meta property="og:url" content="https://tapdex.com" />
    <meta property="og:locale" content="en_HK" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@tapdex" />
    <meta name="twitter:title" content="Tapdex — NFC Digital Business Card" />
    <meta name="twitter:description" content="NFC digital business cards with lifetime free data management. Update anytime, no reprints. Tap to share instantly." />
    <meta name="twitter:image" content="https://tapdex.com/tapdex-logo.svg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Tapdex",
      "url": "https://tapdex.com",
      "logo": "https://tapdex.com/tapdex-logo.svg",
      "description": "NFC digital business cards with lifetime free data management. Update your contact info anytime — no reprints, no fees.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tai Kok Tsui",
        "addressRegion": "Kowloon",
        "addressCountry": "HK"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "hello@tapdex.com"
      },
      "sameAs": [
        "https://www.instagram.com/tapdex",
        "https://www.etsy.com/shop/tapdex"
      ],
      "areaServed": [
        { "@type": "Country", "name": "Hong Kong" },
        { "@type": "Country", "name": "Taiwan" },
        { "@type": "Country", "name": "United States" },
        { "@type": "Country", "name": "United Kingdom" },
        { "@type": "Country", "name": "Singapore" },
        { "@type": "Country", "name": "Australia" }
      ],
      "knowsAbout": [
        "NFC Digital Business Cards",
        "Contactless Business Cards",
        "Smart Name Cards",
        "Digital Networking"
      ]
    }
    </script>

    <!-- Product JSON-LD for the NFC card -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "Tapdex Wood NFC Digital Business Card",
      "description": "Handcrafted wood NFC business card with lifetime free data management. Tap to share your contact instantly. Update your info anytime online — no reprints needed.",
      "brand": { "@type": "Brand", "name": "Tapdex" },
      "offers": {
        "@type": "Offer",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "shippingDetails": {
          "@type": "OfferShippingDetails",
          "shippingDestination": [
            { "@type": "DefinedRegion", "addressCountry": "HK" },
            { "@type": "DefinedRegion", "addressCountry": "US" },
            { "@type": "DefinedRegion", "addressCountry": "GB" },
            { "@type": "DefinedRegion", "addressCountry": "TW" },
            { "@type": "DefinedRegion", "addressCountry": "SG" },
            { "@type": "DefinedRegion", "addressCountry": "AU" }
          ],
          "shippingRate": {
            "@type": "MonetaryAmount",
            "value": "0",
            "currency": "USD"
          }
        }
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
