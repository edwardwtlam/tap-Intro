<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <defs>
    <linearGradient id="tapdexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#00A6FF"/>
      <stop offset="100%" style="stop-color:#007BFF"/>
    </linearGradient>
  </defs>

  <!-- Symbol: interlocking loops -->
  <g transform="translate(100, 36)">
    <circle cx="-14" cy="0" r="16" fill="none" stroke="url(#tapdexGrad)" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="50 100.53" transform="rotate(-15)"/>
    <circle cx="14" cy="0" r="18" fill="none" stroke="url(#tapdexGrad)" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="56 113.10" transform="rotate(15)"/>
  </g>

  <!-- Text: tapdex -->
  <text x="100" y="80" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="-1" text-anchor="middle">
    <tspan fill="#ffffff">tapde</tspan><tspan fill="url(#tapdexGrad)" font-weight="700">x</tspan>
  </text>
</svg>
