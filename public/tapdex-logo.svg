<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="tapdexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#00A6FF"/>
      <stop offset="100%" style="stop-color:#007BFF"/>
    </linearGradient>
    <linearGradient id="tapdexGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B8E6"/>
      <stop offset="100%" style="stop-color:#0066CC"/>
    </linearGradient>
  </defs>

  <!-- Symbol: interlocking @ / infinity loop -->
  <g transform="translate(100, 42)">
    <!-- Left loop -->
    <circle cx="-13" cy="0" r="15" fill="none" stroke="url(#tapdexGrad)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="47.12 94.25"
            transform="rotate(-15)"/>
    <!-- Right loop -->
    <circle cx="13" cy="0" r="17" fill="none" stroke="url(#tapdexGrad)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="53.41 106.81"
            transform="rotate(15)"/>
    <!-- Center overlapped area - left loop over right -->
    <circle cx="-13" cy="0" r="15" fill="none" stroke="url(#tapdexGrad)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="20 94.25" stroke-dashoffset="-25"
            transform="rotate(-15)"/>
    <!-- Right loop over left at top -->
    <circle cx="13" cy="0" r="17" fill="none" stroke="url(#tapdexGrad)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="22 106.81" stroke-dashoffset="-70"
            transform="rotate(15)"/>
  </g>

  <!-- Text: tapdex -->
  <text x="100" y="92" font-family="'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-1" text-anchor="middle">
    <tspan fill="#ffffff">tapde</tspan><tspan fill="url(#tapdexGrad)" font-weight="700">x</tspan>
  </text>
</svg>
